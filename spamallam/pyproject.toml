[project]
name = "spamallam"
version = "1.0.0"
description = "AI-assisted inbound e-mail security filter (postfix content filter + rspamd orchestrator + admin UI)"
requires-python = ">=3.12"
dependencies = [
    "aiosmtpd>=1.4.5",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "cryptography>=42.0",
    "webauthn>=2.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "dnspython>=2.6",
    "maxminddb>=2.6",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.pytest.ini_options]
asyncio_mode = "auto"
