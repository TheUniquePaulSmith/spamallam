<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SpamAllam{% endblock %} · SpamAllam Admin</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">🦙 SpamAllam</div>
  {% if username %}
  <nav>
    <a href="/">Dashboard</a>
    <a href="/settings/ai">AI</a>
    <a href="/settings/provider">Provider</a>
    <a href="/settings/context">Context</a>
    <a href="/settings/tools">Tools</a>
    <a href="/settings/overrides">Overrides</a>
    <a href="/logs">Logs</a>
    <a href="/logs/audit">Audit</a>
    <a href="/users">Users</a>
  </nav>
  <div class="who">{{ username }}{% if is_admin %} <span class="badge">admin</span>{% endif %}
    · <a href="/logout">sign out</a></div>
  {% endif %}
</header>
<main>
  {% block content %}{% endblock %}
</main>
<script src="/static/webauthn.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
