# Action thresholds. spamallam reads the resulting action from /checkv2:
#   reject     -> message is dropped (silent discard, logged)
#   add header -> delivered, tagged as spam (X-Spam-Flag: YES)
#   greylist   -> treated as "deliver + tag" (we are after-queue; cannot greylist)
reject = 15;
add_header = 6;
greylist = 4;
