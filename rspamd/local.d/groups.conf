# Register the antivirus failure symbols at weight 0.0.
#
# Weight zero on purpose: "the scanner could not run" is not evidence that a
# message is spam, so it must not move the score. It is a signal spamallam reads
# to apply the configured failure policy (see docs/FAILURE-POLICY.md), and
# registering it here keeps it present in the metric rather than depending on an
# unregistered symbol showing up in the /checkv2 reply.
group "antivirus" {
  symbols {
    "CLAM_VIRUS_FAIL" {
      weight = 0.0;
      description = "ClamAV could not scan this message";
    }
    "VIRUSTOTAL_VIRUS_FAIL" {
      weight = 0.0;
      description = "VirusTotal lookup failed";
    }
  }
}
