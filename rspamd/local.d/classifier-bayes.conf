# Bayes classifier on redis, single shared corpus, with autolearn.
backend = "redis";
per_user = false;
autolearn {
  spam_threshold = 6.0;   # learn as spam above this score
  ham_threshold = -0.5;   # learn as ham below this score
  check_balance = true;
}
new_schema = true;
expire = 8640000;         # 100 days
